name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "ci/**"
      - "infra/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / Ruff + pytest
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_TEST_URL: redis://localhost:6379/15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Ruff lint
        working-directory: backend
        run: ruff check app tests

      - name: Ruff format
        working-directory: backend
        run: ruff format --check app tests

      - name: Tests
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend / production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Tests
        working-directory: frontend
        run: npm run test
      - name: Build
        working-directory: frontend
        run: npm run build

  compose:
    name: PostgreSQL migrations + Docker Compose validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: youtube
          POSTGRES_USER: youtube
          POSTGRES_PASSWORD: change-me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U youtube -d youtube"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://youtube:change-me@localhost:5432/youtube
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Prepare environment
        run: cp .env.example .env
      - name: Apply PostgreSQL migrations
        run: |
          alembic -c backend/alembic.ini upgrade head
          alembic -c backend/alembic.ini current
      - name: Validate development Compose
        run: docker compose config --quiet
      - name: Validate production Compose
        run: |
          cp .env.production.example .env.production
          bash -n scripts/init-production-env.sh
          docker compose --env-file .env.production -f docker-compose.production.yml config --quiet
