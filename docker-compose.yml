services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-youtube}
      POSTGRES_USER: ${POSTGRES_USER:-youtube}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-youtube} -d ${POSTGRES_DB:-youtube}"]
      interval: 5s
      timeout: 5s
      retries: 10
  minio:
    image: ghcr.io/seaweedfs/minio-compat:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-this-minio-password}
    volumes: [minio_data:/data]
    ports: ["9002:9000", "9003:9001"]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://youtube:change-me@db:5432/youtube}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    ports: ["8003:8000"]
    depends_on: [db]
  frontend:
    build: ./frontend
    ports: ["8083:80"]
    depends_on: [backend]
volumes:
  postgres_data:
  minio_data:
  redis_data:
